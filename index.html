<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이스 디비디비딥</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scene { display: none; width: 100%; max-width: 480px; padding: 20px; }
    .scene.active { display: flex; flex-direction: column; align-items: center; gap: 16px; }

    /* 공통 버튼 */
    .btn {
      padding: 12px 32px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }
    .btn:active { transform: scale(0.97); opacity: 0.85; }
    .btn-primary { background: #6c63ff; color: #fff; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }

    /* 타이틀 씬 */
    #scene-title h1 {
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    #scene-title .subtitle { color: #888; font-size: 14px; text-align: center; }

    /* 가위바위보 씬 */
    .rps-buttons { display: flex; gap: 12px; margin-top: 8px; }
    .rps-btn {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      font-size: 36px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .rps-btn:hover { transform: scale(1.1); border-color: #6c63ff; }
    .rps-result { font-size: 18px; font-weight: bold; min-height: 28px; text-align: center; }

    /* 게임 씬 - 상단 카운터 */
    .counter-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
    }
    .counter-circles { display: flex; gap: 6px; }
    .counter-dot {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid #4ecdc4;
      transition: background 0.3s;
    }
    .counter-dot.filled { background: #4ecdc4; }

    /* 게임 씬 - 얼굴 영역 */
    .faces-area {
      width: 100%;
      display: flex;
      gap: 12px;
      position: relative;
    }
    .face-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .role-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .role-label.attacker { color: #ff6b6b; }
    .role-label.defender { color: #4ecdc4; }

    .face-frame {
      width: 160px; height: 160px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }
    .face-frame.attacker { border: 2px solid #ff6b6b; box-shadow: 0 0 20px rgba(255,107,107,0.25); }
    .face-frame.defender { border: 2px solid #4ecdc4; box-shadow: 0 0 20px rgba(78,205,196,0.25); }

    .face-frame img { width: 100%; height: 100%; object-fit: cover; }

    #webcam-video {
      width: 160px; height: 160px;
      object-fit: cover;
      transform: scaleX(-1);
      border-radius: 14px;
    }

    .face-label {
      font-size: 11px;
      color: #888;
    }
    .expression-badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      min-height: 24px;
      display: flex;
      align-items: center;
    }

    .vs-divider {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #0a0a0f;
      padding: 4px 8px;
      border-radius: 50%;
      font-size: 12px;
      color: #555;
      border: 1px solid #333;
      z-index: 10;
    }

    /* 게임 씬 - 하단 액션 */
    .action-area {
      width: 100%;
      padding: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      text-align: center;
    }
    .dibidibideep-text {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      min-height: 36px;
    }
    .action-hint { font-size: 12px; color: #888; margin-top: 4px; }
    .countdown-display {
      font-size: 48px;
      font-weight: 900;
      color: #6c63ff;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 결과 오버레이 */
    .result-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      font-size: 48px;
      font-weight: 900;
    }
    .result-overlay.hidden { display: none; }

    /* 게임오버 씬 */
    #scene-gameover .winner-text { font-size: 32px; font-weight: 900; }
    #scene-gameover .rounds-text { color: #888; font-size: 14px; }

    /* 로딩 */
    .loading-text { color: #888; font-size: 13px; text-align: center; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .pulsing { animation: pulse 1s ease-in-out infinite; }

    @keyframes dibidibideep-anim {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .dibidibideep-enter { animation: dibidibideep-anim 0.4s ease-out forwards; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Scene 1: 타이틀 -->
  <div id="scene-title" class="scene active">
    <h1>페이스<br>디비디비딥</h1>
    <p class="subtitle">웹캠으로 표정을 인식하는 얼굴 게임</p>
    <p id="loading-status" class="loading-text pulsing">웹캠 및 AI 모델 로딩 중...</p>
    <button id="btn-start" class="btn btn-primary" disabled>시작하기</button>
    <video id="webcam-video-init" style="display:none" playsinline></video>
  </div>

  <!-- Scene 2: 가위바위보 -->
  <div id="scene-rps" class="scene">
    <h2>가위바위보</h2>
  </div>

  <!-- Scene 3: 게임 라운드 -->
  <div id="scene-game" class="scene">
    <h2>게임</h2>
  </div>

  <!-- Scene 4: 게임 오버 -->
  <div id="scene-gameover" class="scene">
    <h2>게임 종료</h2>
  </div>

  <script>
    // ── 전역 상태 ──────────────────────────────────────────────
    const state = {
      faceMesh: null,
      camera: null,
      videoEl: null,
      lastLandmarks: null,
      playerRole: null,
      aiRole: null,
      defenseStreak: 0,
      totalRounds: 0,
    };

    // ── 씬 전환 ────────────────────────────────────────────────
    function showScene(id) {
      document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ── 표정 감지 상수 ─────────────────────────────────────────
    const EAR_THRESHOLD = 0.2;
    const EAR_OPEN_THRESHOLD = 0.25;
    const LEFT_EYE = [33, 160, 158, 133, 153, 144];
    const RIGHT_EYE = [362, 385, 387, 263, 373, 380];
    const TONGUE_TIP = 13;
    const LOWER_LIP_OUTER = 17;
    const UPPER_LIP_OUTER = 0;

    function calcEAR(landmarks, indices) {
      const p = indices.map(i => landmarks[i]);
      const vertical1 = Math.hypot(p[1].x - p[5].x, p[1].y - p[5].y);
      const vertical2 = Math.hypot(p[2].x - p[4].x, p[2].y - p[4].y);
      const horizontal = Math.hypot(p[0].x - p[3].x, p[0].y - p[3].y);
      return (vertical1 + vertical2) / (2 * horizontal);
    }

    function detectExpression(landmarks) {
      if (!landmarks || landmarks.length === 0) return null;
      const leftEAR = calcEAR(landmarks, LEFT_EYE);
      const rightEAR = calcEAR(landmarks, RIGHT_EYE);

      const tongueY = landmarks[TONGUE_TIP].y;
      const lowerLipY = landmarks[LOWER_LIP_OUTER].y;
      const upperLipY = landmarks[UPPER_LIP_OUTER].y;
      const mouthHeight = lowerLipY - upperLipY;
      const tonguePoke = tongueY - lowerLipY;
      if (tonguePoke > mouthHeight * 0.3) return 'tongue';

      if (leftEAR < EAR_THRESHOLD && rightEAR > EAR_OPEN_THRESHOLD) return 'wink_left';
      if (rightEAR < EAR_THRESHOLD && leftEAR > EAR_OPEN_THRESHOLD) return 'wink_right';

      return 'neutral';
    }

    // ── FaceMesh 초기화 ────────────────────────────────────────
    async function initFaceMesh(videoElement) {
      const faceMesh = new FaceMesh({
        locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });
      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
      });
      faceMesh.onResults(results => {
        state.lastLandmarks = results.multiFaceLandmarks?.[0] || null;
      });
      await faceMesh.initialize();
      state.faceMesh = faceMesh;
      return faceMesh;
    }

    async function startCamera(videoElement, faceMesh) {
      return new Promise((resolve, reject) => {
        const camera = new Camera(videoElement, {
          onFrame: async () => {
            await faceMesh.send({ image: videoElement });
          },
          width: 320,
          height: 240,
        });
        camera.start().then(() => {
          state.camera = camera;
          state.videoEl = videoElement;
          resolve(camera);
        }).catch(reject);
      });
    }

    // ── 타이틀 씬 초기화 ───────────────────────────────────────
    (async () => {
      const statusEl = document.getElementById('loading-status');
      const btnStart = document.getElementById('btn-start');
      const initVideo = document.getElementById('webcam-video-init');
      try {
        statusEl.textContent = 'AI 모델 로딩 중...';
        await initFaceMesh(initVideo);
        statusEl.textContent = '웹캠 연결 중...';
        await startCamera(initVideo, state.faceMesh);
        statusEl.textContent = '준비 완료!';
        statusEl.classList.remove('pulsing');
        btnStart.disabled = false;
      } catch (e) {
        statusEl.textContent = '오류: ' + e.message;
      }
      btnStart.addEventListener('click', () => {
        showScene('scene-rps');
        initRpsScene();
      });
    })();
  </script>
</body>
</html>
